name: Test and deploy

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm ci --prefix dashboard
      - run: npm run typecheck
      - run: npm run test:run
      - run: node --test scripts/prepare-cloudflare.test.mjs
      - run: npm run check
      - run: npm run build --prefix dashboard

  deploy:
    needs: test
    if: github.repository == 'shoaibsharif/MAHORAGA' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: mahoraga-halal
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm ci --prefix dashboard
      - run: npm run build --prefix dashboard
      - name: Prepare Cloudflare resources
        run: node scripts/prepare-cloudflare.mjs
      - name: Apply database migrations
        run: npx --no-install wrangler d1 migrations apply mahoraga-halal-db --remote --config wrangler.deploy.generated.json
      - name: Deploy dashboard and Worker
        run: npx --no-install wrangler deploy --config wrangler.deploy.generated.json
